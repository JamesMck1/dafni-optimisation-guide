<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560">
  <title>Illustrative objective-space output</title>
  <desc>Evaluated strategies are shown in grey. The best cost and flood-risk trade-offs are highlighted in teal.</desc>
  <rect width="800" height="560" rx="20" fill="#fbfcf8"/>
  <text x="70" y="48" fill="#123d3a" font-family="Arial, sans-serif" font-size="26" font-weight="700">Compare cost and flood-risk reduction</text>
  <text x="70" y="76" fill="#566b68" font-family="Arial, sans-serif" font-size="15">Each point represents one simulated intervention strategy.</text>
  <line x1="100" y1="450" x2="735" y2="450" stroke="#17312f" stroke-width="3"/>
  <line x1="100" y1="450" x2="100" y2="110" stroke="#17312f" stroke-width="3"/>
  <text x="420" y="515" text-anchor="middle" fill="#17312f" font-family="Arial, sans-serif" font-size="18">Estimated whole-life cost</text>
  <text x="28" y="280" text-anchor="middle" fill="#17312f" font-family="Arial, sans-serif" font-size="18" transform="rotate(-90 28 280)">Flood-risk measure</text>
  <text x="103" y="475" fill="#566b68" font-family="Arial, sans-serif" font-size="13">Lower cost</text>
  <text x="108" y="438" fill="#566b68" font-family="Arial, sans-serif" font-size="13">Lower risk</text>
  <g fill="#aebdb9" opacity=".72">
    <circle cx="165" cy="164" r="6"/><circle cx="195" cy="188" r="6"/><circle cx="223" cy="175" r="6"/>
    <circle cx="249" cy="231" r="6"/><circle cx="278" cy="204" r="6"/><circle cx="302" cy="255" r="6"/>
    <circle cx="333" cy="229" r="6"/><circle cx="360" cy="278" r="6"/><circle cx="391" cy="252" r="6"/>
    <circle cx="421" cy="304" r="6"/><circle cx="451" cy="283" r="6"/><circle cx="482" cy="324" r="6"/>
    <circle cx="512" cy="307" r="6"/><circle cx="544" cy="348" r="6"/><circle cx="576" cy="329" r="6"/>
    <circle cx="606" cy="374" r="6"/><circle cx="636" cy="350" r="6"/><circle cx="667" cy="391" r="6"/>
    <circle cx="232" cy="144" r="6"/><circle cx="318" cy="183" r="6"/><circle cx="406" cy="213" r="6"/>
    <circle cx="495" cy="261" r="6"/><circle cx="589" cy="296" r="6"/><circle cx="687" cy="349" r="6"/>
  </g>
  <path d="M145 330 C220 353 285 368 350 382 S505 410 690 423" fill="none" stroke="#176f68" stroke-width="5" stroke-linecap="round"/>
  <g fill="#176f68" stroke="#ffffff" stroke-width="3">
    <circle cx="145" cy="330" r="10"/><circle cx="220" cy="353" r="10"/><circle cx="292" cy="371" r="10"/>
    <circle cx="365" cy="387" r="10"/><circle cx="450" cy="402" r="10"/><circle cx="550" cy="414" r="10"/>
    <circle cx="690" cy="423" r="10"/>
  </g>
  <circle cx="365" cy="387" r="16" fill="none" stroke="#f0ae43" stroke-width="5"/>
  <path d="M380 370 L465 325" fill="none" stroke="#9b6419" stroke-width="2"/>
  <rect x="458" y="291" width="190" height="42" rx="8" fill="#fff3dc"/>
  <text x="553" y="317" text-anchor="middle" fill="#74480e" font-family="Arial, sans-serif" font-size="15" font-weight="700">Selected strategy</text>
  <g transform="translate(500 105)">
    <circle cx="10" cy="10" r="7" fill="#aebdb9"/>
    <text x="26" y="15" fill="#566b68" font-family="Arial, sans-serif" font-size="14">Evaluated strategy</text>
    <circle cx="10" cy="42" r="9" fill="#176f68" stroke="#ffffff" stroke-width="2"/>
    <text x="26" y="47" fill="#566b68" font-family="Arial, sans-serif" font-size="14">Best trade-off strategy</text>
  </g>
</svg>
